<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10233f">
  <title>Circuit Switch Prize Game</title>
  <style>
    :root{--ink:#132238;--muted:#6a7587;--navy:#10233f;--blue:#2d7df6;--blue-dark:#1459bd;--yellow:#f6c945;--yellow-bright:#ffe77a;--red:#ef6262;--paper:#f7f5ef;--line:#d8dee8}
    *{box-sizing:border-box}[hidden]{display:none!important}html{min-width:320px;background:var(--navy)}body{min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
    .game-shell{position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 12% 12%,rgba(45,125,246,.09) 0 2px,transparent 3px) 0 0/28px 28px,linear-gradient(150deg,#fbfaf6 0%,#f3f1eb 62%,#e9edf3 100%)}
    .game-shell:before{position:fixed;z-index:0;right:-140px;bottom:-220px;width:520px;height:520px;border:90px solid rgba(45,125,246,.055);border-radius:50%;content:""}
    .topbar{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px clamp(22px,4vw,64px);border-bottom:1px solid rgba(16,35,63,.1);background:rgba(255,255,255,.76);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:13px}.brand-mark{display:grid;width:44px;height:44px;place-items:center;border-radius:13px;background:var(--yellow);box-shadow:0 7px 18px rgba(178,139,23,.2);font-size:23px}.eyebrow,.kicker,.result-label{margin:0;color:var(--blue-dark);font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.brand h1{margin:2px 0 0;font-size:clamp(1.2rem,2.4vw,1.55rem);letter-spacing:-.035em}
    .topbar-actions{display:flex;align-items:center;gap:10px}.round-pill{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#526077;font-size:.82rem;font-weight:800}.icon-button,.new-round{cursor:pointer;transition:transform 160ms ease,box-shadow 160ms ease,background 160ms ease}.icon-button{display:grid;width:43px;height:43px;place-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:1.05rem}.icon-button:hover,.new-round:hover{transform:translateY(-2px)}
    .new-round{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:43px;padding:0 17px;border:0;border-radius:12px;background:var(--navy);box-shadow:0 7px 18px rgba(16,35,63,.2);color:#fff;font-size:.86rem;font-weight:800}
    .game-card{position:relative;z-index:1;width:min(1180px,calc(100% - 36px));margin:34px auto 22px;padding:clamp(24px,4vw,45px);border:1px solid rgba(16,35,63,.12);border-radius:30px;background:rgba(255,255,255,.94);box-shadow:0 26px 70px rgba(37,51,74,.14)}
    .game-heading{text-align:center}.game-heading h2{margin:7px 0 8px;font-size:clamp(2rem,4.8vw,4rem);line-height:1;letter-spacing:-.055em}.instructions{min-height:26px;margin:0;color:var(--muted);font-size:clamp(.95rem,1.6vw,1.1rem);font-weight:600}
    .circuit-board{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr) 190px;align-items:center;gap:clamp(16px,3vw,42px);max-width:1030px;margin:40px auto 36px;padding:clamp(18px,3vw,30px);border:1px solid #d9e1ec;border-radius:24px;background:linear-gradient(rgba(35,71,118,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(35,71,118,.035) 1px,transparent 1px),#f8fafc;background-size:24px 24px;box-shadow:inset 0 1px 0 #fff}
    .power-rail{position:relative;display:flex;width:74px;height:108px;align-items:center;justify-content:center}.battery-body{width:42px;height:80px;border:4px solid var(--navy);border-radius:7px;background:linear-gradient(to top,var(--yellow) 0 68%,#fff 68%);box-shadow:0 9px 18px rgba(16,35,63,.12)}.battery-body:before{position:absolute;top:9px;left:29px;width:17px;height:8px;border:3px solid var(--navy);border-bottom:0;border-radius:3px 3px 0 0;content:""}.terminal{position:absolute;left:50%;color:var(--navy);font-size:1rem;font-weight:900;transform:translateX(-50%)}.positive{top:-4px}.negative{bottom:-5px}.power-rail:after{position:absolute;top:50%;left:calc(100% - 3px);width:clamp(34px,5vw,66px);height:4px;border-radius:999px;background:var(--navy);content:""}
    .switch-grid{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:15px}.switch-control{position:relative;display:flex;min-width:0;min-height:126px;cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:13px 9px 11px;overflow:visible;border:2px solid #cfdae8;border-radius:17px;outline:none;background:#fff;box-shadow:0 7px 0 #dbe3ed,0 11px 23px rgba(39,60,87,.09);color:var(--ink);transition:transform 160ms ease,border-color 160ms ease,box-shadow 160ms ease,background 160ms ease}.switch-control:not(:disabled):hover{z-index:2;border-color:var(--blue);box-shadow:0 7px 0 #b9cff1,0 14px 25px rgba(45,125,246,.17);transform:translateY(-3px)}.switch-control:not(:disabled):active{box-shadow:0 2px 0 #b9cff1;transform:translateY(4px)}.switch-control:focus-visible{outline:4px solid rgba(45,125,246,.26);outline-offset:3px}.switch-control:disabled{cursor:default}.switch-control.is-dead{border-color:#e6c2c2;background:#fff8f8;box-shadow:0 5px 0 #ead1d1;opacity:.72}.switch-control.is-live{border-color:#e1ac09;background:#fff9da;box-shadow:0 7px 0 #e6b92d,0 0 30px rgba(246,201,69,.45);animation:live-pulse 900ms ease-in-out infinite alternate}
    .switch-number{position:absolute;top:8px;left:10px;display:grid;width:26px;height:26px;place-items:center;border-radius:8px;background:#eaf2ff;color:var(--blue-dark);font-size:.8rem;font-weight:900}.is-dead .switch-number{background:#f7dfdf;color:#aa4242}.is-live .switch-number{background:var(--yellow);color:#5d4700}.switch-hardware{position:relative;display:grid;width:46px;height:60px;place-items:center;border:3px solid #233d60;border-radius:23px;background:#d9e2ec;box-shadow:inset 0 3px 7px rgba(16,35,63,.2)}.switch-slot{position:relative;display:block;width:13px;height:39px;border-radius:999px;background:#0e213b}.switch-lever{position:absolute;top:-1px;left:50%;width:28px;height:28px;border:3px solid #132238;border-radius:50%;background:#fff;box-shadow:0 3px 5px rgba(16,35,63,.25);transform:translateX(-50%);transition:transform 180ms cubic-bezier(.2,.8,.2,1),background 180ms ease}.is-chosen .switch-lever{background:var(--red);transform:translate(-50%,14px)}.is-live .switch-lever{background:var(--yellow-bright)}.switch-result{color:#8390a3;font-size:.62rem;font-weight:900;letter-spacing:.1em}.is-dead .switch-result{color:#b45353}.is-live .switch-result{color:#846300}.wire{position:absolute;top:50%;z-index:-1;height:4px;background:#274c77;transform:translateY(-50%)}.wire-in{right:100%;width:10px}.wire-out{left:100%;width:10px}
    .bulb-zone{position:relative;display:flex;min-height:198px;align-items:center;justify-content:center;flex-direction:column}.bulb-zone:before{position:absolute;top:49%;right:calc(100% - 21px);width:clamp(28px,4vw,54px);height:4px;border-radius:999px;background:#274c77;content:""}.bulb{position:relative;z-index:2;display:grid;width:112px;height:112px;place-items:center;border:5px solid #233d60;border-radius:50%;background:#dfe5eb;box-shadow:inset -12px -13px 20px rgba(31,50,76,.13);transition:background 260ms ease,box-shadow 260ms ease}.is-winner .bulb{background:var(--yellow-bright);box-shadow:inset -11px -12px 19px rgba(204,143,0,.22),0 0 22px #ffe168,0 0 54px rgba(255,211,63,.8),0 0 90px rgba(255,211,63,.42)}.bulb-shine{position:absolute;top:17px;left:21px;width:25px;height:12px;border-radius:50%;background:rgba(255,255,255,.78);transform:rotate(-33deg)}.filament{margin-top:27px;color:#6f7c8e;font-family:Georgia,serif;font-size:3rem;font-weight:bold;transform:rotate(90deg)}.is-winner .filament{color:#be7600}.bulb-base{position:relative;z-index:3;width:58px;margin-top:-10px;padding:8px 5px 10px;border:4px solid #233d60;border-top:0;border-radius:0 0 15px 15px;background:#95a1af}.bulb-base span{display:block;height:3px;margin:3px 0;border-radius:999px;background:#53647a}.bulb-rays{position:absolute;top:9px;left:50%;width:112px;height:112px;opacity:0;transition:opacity 230ms ease;transform:translateX(-50%)}.is-winner .bulb-rays{opacity:1}.bulb-rays span{position:absolute;top:-23px;left:53px;width:6px;height:17px;border-radius:999px;background:var(--yellow);box-shadow:0 0 7px rgba(246,201,69,.5);transform-origin:3px 79px}.return-wire{position:absolute;right:50%;bottom:-15px;width:calc(100% + 645px);height:31px;border-right:4px solid #274c77;border-bottom:4px solid #274c77;border-left:4px solid #274c77;border-radius:0 0 15px 15px}
    .result-panel{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;max-width:1030px;min-height:84px;margin:0 auto;padding:15px 18px;border:1px solid #d7e0ec;border-radius:17px;background:#f5f8fc;transition:background 220ms ease,border-color 220ms ease}.result-icon{display:grid;width:48px;height:48px;place-items:center;border-radius:14px;background:#e5edf7;color:#5c6d83;font-size:1.5rem;font-weight:900}.result-panel h3{margin:3px 0 0;font-size:clamp(1rem,2vw,1.25rem)}.result-miss{border-color:#eccaca;background:#fff8f8}.result-miss .result-icon{background:#f7dddd;color:#b44848}.result-miss .result-label{color:#b44848}.result-winner{border-color:#e6c452;background:#fff9dc;box-shadow:0 10px 30px rgba(182,137,0,.12)}.result-winner .result-icon{background:var(--yellow);color:#5d4700;animation:spin-star 650ms cubic-bezier(.2,.9,.3,1.25)}.result-winner .result-label{color:#806200}.tries{color:#718096;font-size:.78rem;font-weight:800}
    footer{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 20px 32px;color:#627086;font-size:.77rem;font-weight:800;letter-spacing:.025em}.footer-arrow{color:var(--blue)}.confetti{position:fixed;z-index:20;inset:0;overflow:hidden;pointer-events:none}.confetti span{position:absolute;top:-20px;width:10px;height:18px;border-radius:2px;animation:confetti-fall ease-in forwards}
    @keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(760deg)}}@keyframes live-pulse{from{transform:translateY(0)}to{transform:translateY(-3px)}}@keyframes spin-star{from{transform:rotate(-180deg) scale(.25)}to{transform:rotate(0) scale(1)}}
    @media(max-width:900px){.circuit-board{grid-template-columns:60px minmax(0,1fr) 130px;gap:12px}.switch-grid{grid-template-columns:repeat(2,minmax(100px,1fr))}.return-wire{width:calc(100% + 430px)}.bulb{width:92px;height:92px}.bulb-rays{top:19px;transform:translateX(-50%) scale(.82)}}
    @media(max-width:640px){.topbar{padding:14px 16px}.eyebrow,.round-pill{display:none}.brand-mark{width:39px;height:39px;border-radius:11px}.top-new-round{padding:0 12px}.top-new-round span{display:none}.game-card{width:calc(100% - 20px);margin-top:14px;padding:23px 13px;border-radius:23px}.game-heading h2{font-size:2.15rem}.instructions{min-height:46px;padding:0 6px}.circuit-board{display:block;margin-top:24px;padding:16px 12px 23px}.power-rail{display:none}.switch-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.switch-control{min-height:112px}.wire,.bulb-zone:before,.return-wire{display:none}.bulb-zone{min-height:170px;margin-top:28px}.result-panel{grid-template-columns:auto 1fr}.result-panel .new-round,.tries{grid-column:1/-1;width:100%}.tries{text-align:center}footer{flex-wrap:wrap;padding-bottom:24px;gap:7px 9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="game-shell" id="gameShell">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">⚡</span><div><p class="eyebrow">Classroom prize game</p><h1>Circuit Switch</h1></div></div>
      <div class="topbar-actions"><span class="round-pill" id="roundPill">Round 1</span><button class="icon-button" id="soundButton" type="button" aria-label="Turn sound off" title="Sound on">🔊</button><button class="new-round top-new-round" id="newRoundTop" type="button"><span aria-hidden="true">↻</span> New round</button></div>
    </header>
    <section class="game-card" aria-live="polite">
      <div class="game-heading"><p class="kicker">Only one switch will light the bulb</p><h2>Which circuit is live?</h2><p class="instructions" id="instructions">Answer a question correctly, then choose one switch.</p></div>
      <div class="circuit-board">
        <div class="power-rail" aria-hidden="true"><span class="terminal positive">+</span><span class="battery-body"></span><span class="terminal negative">−</span></div>
        <div class="switch-grid" id="switchGrid" aria-label="Choose a circuit switch"></div>
        <div class="bulb-zone" id="bulbZone" aria-label="Bulb is off">
          <div class="bulb-rays" aria-hidden="true" id="bulbRays"></div>
          <div class="bulb" aria-hidden="true"><span class="bulb-shine"></span><span class="filament">⌁</span></div>
          <div class="bulb-base" aria-hidden="true"><span></span><span></span><span></span></div><div class="return-wire" aria-hidden="true"></div>
        </div>
      </div>
      <div class="result-panel result-ready" id="resultPanel"><span class="result-icon" id="resultIcon" aria-hidden="true">?</span><div><p class="result-label" id="resultLabel">Ready to play</p><h3 id="resultHeading">Get a question right to have a go</h3></div><span class="tries" id="tries">0/8 tested</span><button class="new-round" id="playAgain" type="button" hidden>Play again <span aria-hidden="true">→</span></button></div>
    </section>
    <footer><span>Correct answer</span><span class="footer-arrow" aria-hidden="true">→</span><span>Choose a switch</span><span class="footer-arrow" aria-hidden="true">→</span><span>Light the bulb</span><span class="footer-arrow" aria-hidden="true">→</span><span>Win a prize</span></footer>
  </main>
  <script>
    const COUNT=8,colours=["#f6c945","#ff6b6b","#6ee7b7","#69b7ff","#c084fc"];
    let winningSwitch=null,chosen=new Set(),gameState="ready",round=0,muted=false;
    const shell=document.getElementById("gameShell"),grid=document.getElementById("switchGrid"),instructions=document.getElementById("instructions"),resultPanel=document.getElementById("resultPanel"),resultIcon=document.getElementById("resultIcon"),resultLabel=document.getElementById("resultLabel"),resultHeading=document.getElementById("resultHeading"),tries=document.getElementById("tries"),playAgain=document.getElementById("playAgain"),bulbZone=document.getElementById("bulbZone"),roundPill=document.getElementById("roundPill"),soundButton=document.getElementById("soundButton"),confetti=document.getElementById("confetti");
    document.getElementById("bulbRays").innerHTML=Array.from({length:12},(_,i)=>`<span style="transform:rotate(${i*30}deg)"></span>`).join("");
    grid.innerHTML=Array.from({length:COUNT},(_,i)=>{const n=i+1;return `<button class="switch-control" type="button" data-switch="${n}" aria-label="Switch ${n}"><span class="wire wire-in" aria-hidden="true"></span><span class="switch-number">${n}</span><span class="switch-hardware" aria-hidden="true"><span class="switch-slot"><span class="switch-lever"></span></span></span><span class="switch-result">CHOOSE</span><span class="wire wire-out" aria-hidden="true"></span></button>`}).join("");
    function playTone(kind){if(muted)return;const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const context=new AudioCtx(),gain=context.createGain();gain.connect(context.destination);const notes=kind==="winner"?[523.25,659.25,783.99,1046.5]:kind==="miss"?[180,140]:[260];notes.forEach((frequency,index)=>{const oscillator=context.createOscillator(),noteGain=context.createGain(),start=context.currentTime+index*.12;oscillator.type=kind==="winner"?"triangle":"sine";oscillator.frequency.value=frequency;noteGain.gain.setValueAtTime(.0001,start);noteGain.gain.exponentialRampToValueAtTime(.16,start+.015);noteGain.gain.exponentialRampToValueAtTime(.0001,start+.22);oscillator.connect(noteGain);noteGain.connect(gain);oscillator.start(start);oscillator.stop(start+.24)});setTimeout(()=>context.close(),1000)}
    function launchConfetti(){confetti.innerHTML=Array.from({length:36},(_,i)=>`<span style="left:${(i*29+7)%100}%;animation-delay:${(i%9)*.07}s;animation-duration:${1.7+(i%5)*.18}s;background:${colours[i%5]}"></span>`).join("")}
    function render(){shell.classList.toggle("is-winner",gameState==="winner");bulbZone.setAttribute("aria-label",gameState==="winner"?"Bulb is lit":"Bulb is off");roundPill.textContent=`Round ${round}`;tries.textContent=`${chosen.size}/${COUNT} tested`;tries.hidden=gameState==="winner";playAgain.hidden=gameState!=="winner";document.querySelectorAll(".switch-control").forEach(button=>{const n=Number(button.dataset.switch),isChosen=chosen.has(n),isWinner=isChosen&&n===winningSwitch,isWrong=isChosen&&!isWinner;button.disabled=isChosen||gameState==="winner";button.className=`switch-control${isChosen?" is-chosen":""}${isWinner?" is-live":""}${isWrong?" is-dead":""}`;button.querySelector(".switch-result").textContent=isWinner?"LIVE":isWrong?"NO POWER":"CHOOSE";button.setAttribute("aria-label",`Switch ${n}${isWinner?", winning switch":isWrong?", not connected":""}`)});resultPanel.className=`result-panel result-${gameState}`;if(gameState==="winner"){resultIcon.textContent="★";resultLabel.textContent="Circuit complete";resultHeading.textContent="Winner! Choose a prize."}else{resultIcon.textContent=gameState==="miss"?"×":"?";resultLabel.textContent=gameState==="miss"?"Open circuit":"Ready to play";resultHeading.textContent=gameState==="miss"?`${COUNT-chosen.size} switches remain`:"Get a question right to have a go"}}
    function chooseSwitch(n){if(gameState==="winner"||chosen.has(n))return;chosen.add(n);playTone("switch");if(n===winningSwitch){gameState="winner";instructions.textContent=`Switch ${n} completed the circuit!`;setTimeout(()=>playTone("winner"),110);launchConfetti()}else{gameState="miss";instructions.textContent=`Switch ${n} was not connected. Try again after the next correct answer.`;setTimeout(()=>playTone("miss"),90)}render()}
    function newRound(){winningSwitch=Math.floor(Math.random()*COUNT)+1;chosen=new Set();gameState="ready";round++;instructions.textContent="Answer a question correctly, then choose one switch.";confetti.innerHTML="";render()}
    grid.addEventListener("click",event=>{const button=event.target.closest(".switch-control");if(button)chooseSwitch(Number(button.dataset.switch))});
    document.getElementById("newRoundTop").addEventListener("click",newRound);playAgain.addEventListener("click",newRound);soundButton.addEventListener("click",()=>{muted=!muted;soundButton.textContent=muted?"🔇":"🔊";soundButton.setAttribute("aria-label",muted?"Turn sound on":"Turn sound off");soundButton.title=muted?"Sound off":"Sound on"});newRound();
  </script>
</body>
</html>
