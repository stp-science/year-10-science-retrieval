 function sync(){if(enabled&&active)play();else music.pause();}
 function notes(type){if(!enabled||!Context)return;try{context??=new Context();const resumed=context.resume();resumed?.catch?.(()=>{});const sequences={start:[147,220,294,311],good:[587,880],bank:[294,349,440,587],wrong:[155,110,73],finish:[294,233,147,73]};const list=sequences[type]??sequences.good;list.forEach((frequency,i)=>{const start=context.currentTime+i*.105,osc=context.createOscillator(),gain=context.createGain();osc.frequency.value=frequency;osc.type=type==='wrong'?'triangle':'sine';gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.09,start+.015);gain.gain.exponentialRampToValueAtTime(.0001,start+.28);osc.connect(gain);gain.connect(context.destination);osc.start(start);osc.stop(start+.3);});}catch{}}
 return {get enabled(){return enabled;},toggle(){enabled=!enabled;sync();if(enabled)notes('good');return enabled;},start(){active=true;risk=0;finalMinute=false;music.currentTime=0;intensity();sync();notes('start');},stop(){active=false;music.pause();},setRisk(points){risk=points;intensity();},urgent(){finalMinute=true;intensity();},tone:notes};
}

const $=id=>document.getElementById(id), app=$('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n.toLocaleString('en-NZ');
let topics=[],run,deck=[],current,interval,best=0,currentOptions=[];
try{best=Number(localStorage.getItem('general-knowledge-vault-best')||0);}catch{}
const showAudio=createShowAudio();
$('sound').onclick=()=>{const on=showAudio.toggle();$('sound').textContent=on?'♫ Sound on':'♫ Sound off';$('sound').setAttribute('aria-pressed',String(on));};
function tone(type){showAudio.tone(type==='bad'?'wrong':type);}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const el=document.createElement('div');el.className='confetti';el.setAttribute('aria-hidden','true');el.innerHTML=Array.from({length:35},()=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.35}s;transform:rotate(${Math.random()*180}deg)"></i>`).join('');document.body.append(el);setTimeout(()=>el.remove(),2400);$('question-card')?.classList.add('bank-flash');}
function setup(){clearInterval(interval);showAudio.stop();run=null;document.body.dataset.view='setup';app.innerHTML=`<div class="intro-grid"><div class="hero-copy"><div class="show-badge">The Year 10 general knowledge gameshow</div><h1 class="show-title"><span>Trivia</span><span class="gold">Vault</span></h1><p class="tagline">KNOW IT. BANK IT. RISK IT.</p><p class="lead">Every right answer raises the stakes.<br>Bank your points… or put your chain on the line.</p><button class="primary enter" id="start">Let’s play!</button><div class="entry-note">5 minutes · Individual play · All ${topics.length} topics</div></div><div class="vault-scene" aria-hidden="true"><div class="halo"></div><span class="spark a">✦</span><span class="spark b">✦</span><span class="spark c">✧</span><div class="vault-art"><div class="vault-ring"></div><div class="vault-door"><div class="vault-centre"><span class="lock-mark">◈</span><strong>1,000</strong><span>TOP OF THE CHAIN</span></div></div></div><div class="float-badge clock-badge"><small>ON THE CLOCK</small><strong>5:00</strong></div><div class="float-badge topic-badge"><small>GENERAL KNOWLEDGE</small><strong>${topics.reduce((n,t)=>n+t.questions.length,0)} questions</strong></div></div></div><section class="setup" aria-label="How to play"><div class="rules"><div class="rule"><span class="rule-icon" aria-hidden="true">✦</span><div><strong>Build your chain</strong><small>Pick the right answer to climb the prize ladder.</small></div></div><div class="rule"><span class="rule-icon" aria-hidden="true">▣</span><div><strong>Bank it or risk it</strong><small>Bank to keep it. Get one wrong and lose your chain.</small></div></div><div class="rule"><span class="rule-icon" aria-hidden="true">◷</span><div><strong>Beat the clock</strong><small>Bank before time’s up. A 1,000 chain banks itself.</small></div></div></div><div class="setup-note"><span>All ${topics.length} topics automatically mixed · Banked points always stay safe</span><span>${best?'Personal best: '+fmt(best)+' points':'Music and sound on · Use the button above to mute'}</span></div></section>`;
 $('start').onclick=start;}
function start(){showAudio.start();document.body.dataset.view='game';run=newRun();deck=makeDeck(topics);next();clearInterval(interval);interval=setInterval(tick,150);}
function ensureLive(){if(live(run))return true;results();return false;}
function next(){if(!ensureLive())return;if(!deck.length){finish(run);run.exhausted=true;results();return;}current=deck.shift();run.phase='question';currentOptions=shuffle([current.a,...current.wrong]);screen();}
function ladder(){const nextValue=LADDER[LADDER.indexOf(run.chain)+1];return `<aside class="ladder" aria-label="Points ladder"><h3>PRIZE LADDER</h3>${[...LADDER].reverse().map(n=>`<div class="rung ${run.chain===n?'active':nextValue===n?'next':''}">${fmt(n)}<span>${run.chain===n?'CURRENT':nextValue===n?'NEXT':''}</span></div>`).join('')}<p class="ladder-note">Reach the top.<br>1,000 banks automatically.</p></aside>`;}
function questionContent(){
 const phase=run.phase;
 const heading=`<div class="question-meta"><span>${esc(current.topic)}</span><span>Question ${run.attempts+(phase==='feedback'?0:1)}</span></div><h2 class="question" id="question-heading" tabindex="-1">${esc(current.q)}</h2>`;
 const options=`<div class="options">${currentOptions.map((o,i)=>`<button data-option="${i}" ${phase!=='question'?'disabled':''} class="${phase!=='question'?(o===current.a?'correct':o===run.lastChoice?'wrong':''):''}"><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
 if(phase==='question')return heading+options;
 return heading+options+`<div class="message bad" role="status"><strong>Not quite.</strong> ${run.lastLost?fmt(run.lastLost)+' unbanked points lost. ':''}Your banked points are safe.</div><div class="answer"><strong>Correct answer</strong>${esc(current.a)}</div><div class="actions"><button class="primary" id="next">Next question</button></div>`;
}

function decisionContent(){
 const nextValue=LADDER[LADDER.indexOf(run.chain)+1];
 const secured=!run.chain;
 return `<div class="decision"><div class="eyebrow">${secured?'★ Vault secured ★':'✦ That’s correct! ✦'}</div><div class="decision-value">${run.autoBanked?'1,000':secured?fmt(run.banked):fmt(run.chain)}</div><div class="decision-label">${secured?'POINTS SAFELY BANKED':'POINTS ON THE LINE'}</div><div class="answer"><strong>Correct answer</strong>${esc(current.a)}</div><p class="muted">${run.autoBanked?'You hit the top! 1,000 points secured. Time for a fresh chain.':secured?'Locked in. Your next answer starts a fresh chain.':'Bank your '+fmt(run.chain)+' points, or risk them for <strong>'+fmt(nextValue)+'</strong> on the next question.'}</p><div class="actions">${run.chain?'<button class="bank" id="bank">BANK '+fmt(run.chain)+'</button>':''}<button class="${run.chain?'risk':'primary'}" id="continue">${run.chain?'RISK IT':'Keep playing'}</button></div><p class="notice" id="notice" role="status"></p></div>`;
}
function screen(){showAudio.setRisk(run.chain);app.innerHTML=`<section aria-label="Game"><div class="hud"><div class="stat"><div class="stat-label">In the vault</div><div class="number">${fmt(run.banked)}</div></div><div class="stat"><div class="stat-label">At risk</div><div class="number">${fmt(run.chain)}</div></div><div class="stat"><div class="stat-label">Time left</div><div class="number clock" id="clock">5:00</div></div></div><div class="game-grid"><section class="card" id="question-card">${run.phase==='decision'?decisionContent():questionContent()}</section>${ladder()}</div><div class="progress" aria-hidden="true"><div id="time-bar"></div></div><div class="game-bottom"><span>${run.correct} correct / ${run.attempts} answered · Automatically marked</span><button class="quiet" id="end">End round</button></div></section>`;
 app.querySelectorAll('[data-option]').forEach(button=>button.onclick=()=>answer(currentOptions[Number(button.dataset.option)]));
 $('bank')?.addEventListener('click',()=>{if(!ensureLive())return;const points=bank(run);if(!points)return;tone('bank');screen();celebrate();$('notice').textContent=`${fmt(points)} points secured. Your next answer starts a fresh chain.`;$('continue').focus();});
 $('continue')?.addEventListener('click',next);$('next')?.addEventListener('click',next);
 $('end').onclick=()=>{if(confirm('End this round? Any unbanked points will be lost.')){finish(run);results();}};
 tick();}
function answer(choice){if(!ensureLive()||run.phase!=='question')return;run.lastChoice=choice;run.phase='revealed';const good=choice===current.a;if(mark(run,{q:current.q,a:current.a,topic:current.topic,choice},good)){tone(good?(run.autoBanked?'bank':'good'):'bad');screen();if(good){$('question-card')?.classList.add('answer-flash');if(run.autoBanked)celebrate();}(good?$('bank')||$('continue'):$('next'))?.focus();}}

function tick(){if(!run||run.ended)return;const ms=remaining(run);if(!ms){finish(run);tone('finish');results();return;}const secs=Math.ceil(ms/1000);if(secs<=60)showAudio.urgent();if($('clock')){$('clock').textContent=`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;$('clock').classList.toggle('urgent',secs<=30);}if($('time-bar'))$('time-bar').style.width=`${ms/3000}%`;}
function results(){clearInterval(interval);showAudio.stop();document.body.dataset.view='results';if(!run)return;if(!run.ended)finish(run);const previous=best;best=Math.max(best,run.banked);try{localStorage.setItem('general-knowledge-vault-best',String(best));}catch{}const mistakes=[...new Map(run.mistakes.map(q=>[q.q,q])).values()];app.innerHTML=`<section class="results"><div class="results-hero"><div class="trophy" aria-hidden="true">★</div><div class="eyebrow">${run.exhausted?'Question mix complete':'Vault closed'}</div><h1>${run.banked>previous?'A new personal best.':'Your final haul.'}</h1><div class="result-score">${fmt(run.banked)}</div><p class="muted">points safely banked${run.lostAtEnd?` · ${fmt(run.lostAtEnd)} unbanked points lost when the round ended`:''}</p><div class="result-stats"><span><strong>${run.correct} / ${run.attempts}</strong><br>answers correct</span><span><strong>${run.attempts?Math.round(run.correct/run.attempts*100):0}%</strong><br>accuracy</span><span><strong>${fmt(run.bestChain)}</strong><br>best chain</span></div><div class="actions"><button class="primary" id="again">Play again</button><button id="settings">Back to start</button></div></div><section class="review"><h3>Questions to revisit</h3>${mistakes.length?mistakes.map(q=>`<details><summary>${esc(q.q)}</summary><small>${esc(q.topic)}</small><p>${esc(q.a)}</p></details>`).join(''):'<p class="empty muted">'+(run.attempts?'No missed answers recorded. Play again for a fresh question mix.':'No answers recorded this round.')+'</p>'}</section><p class="muted">Answers are automatically marked. Personal best is saved on this device.</p></section>`;if(run.banked>0)celebrate();$('again').onclick=start;$('settings').onclick=setup;window.scrollTo({top:0,behavior:'instant'});}
window.addEventListener('beforeunload',e=>{if(run&&!run.ended){e.preventDefault();e.returnValue='';}});
topics=JSON.parse(document.getElementById('question-data').textContent);setup();</script>
</body></html>
